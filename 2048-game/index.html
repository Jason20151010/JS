<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 // QuickQuest Arcade</title><style>:root{--bg:#15181d;--paper:#f3efe6;--muted:#92989e;--lime:#d8f36a;--coral:#ff6d5b;--line:#383e45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:16px Arial,sans-serif}.bar{height:76px;width:min(900px,calc(100% - 36px));margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:var(--paper);text-decoration:none;font-weight:800;letter-spacing:.08em}.back{font-size:.7rem;color:var(--muted)}.wrap{width:min(900px,calc(100% - 36px));margin:auto;padding:36px 0;text-align:center}h1{font-size:clamp(3.5rem,10vw,6.5rem);line-height:.8;letter-spacing:-.1em;margin:0 0 25px}h1 span{color:var(--coral)}.stats{display:flex;justify-content:center;gap:10px;margin:18px auto}.stats span{background:#20252c;padding:10px 14px;color:var(--lime);font-size:.7rem;font-weight:800;letter-spacing:.08em}.board{width:min(460px,calc(100vw - 48px));aspect-ratio:1;margin:24px auto;background:#8b9a75;border:10px solid #8b9a75;border-radius:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cell{display:grid;place-items:center;border-radius:6px;background:#b9c39e;color:#384331;font-size:clamp(1.1rem,6vw,2.1rem);font-weight:900}.cell[data-v="2"]{background:#eee9d8}.cell[data-v="4"]{background:var(--lime)}.cell[data-v="8"]{background:#ff9b73;color:white}.cell[data-v="16"],.cell[data-v="32"]{background:var(--coral);color:#fff}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.buttons button{border:0;background:var(--lime);padding:12px 18px;font-weight:900;cursor:pointer}.hint{color:var(--muted);font-size:.75rem;margin-top:20px}</style></head><body><header class="bar"><a href="../index.html">✦ QUICKQUEST <span style="color:#ff6d5b">ARCADE</span></a><a class="back" href="../index.html">← ALL GAMES</a></header><main class="wrap"><h1>20<span>48</span></h1><div class="stats"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div><div id="board" class="board"></div><div class="buttons"><button data-d="left">←</button><button data-d="up">↑</button><button data-d="down">↓</button><button data-d="right">→</button><button id="new">NEW GAME</button></div><p class="hint">Use the arrow keys or buttons to slide matching tiles.</p></main><script>let g=Array.from({length:4},()=>Array(4).fill(0)),score=0,best=+localStorage.quickBest2048||0;const board=document.querySelector('#board');document.querySelector('#best').textContent=best;function add(){let e=[];g.forEach((r,y)=>r.forEach((v,x)=>!v&&e.push([x,y])));if(e.length){let[x,y]=e[Math.random()*e.length|0];g[y][x]=Math.random()<.9?2:4}}function draw(){board.innerHTML=g.flat().map(v=>`<div class="cell" data-v="${v}">${v||''}</div>`).join('');document.querySelector('#score').textContent=score}function move(d){let old=JSON.stringify(g),v=d==='up'||d==='down';if(v)g=g[0].map((_,i)=>g.map(r=>r[i]));if(d==='right'||d==='down')g=g.map(r=>r.reverse());g=g.map(r=>{let a=r.filter(Boolean);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}return a.concat(Array(4-a.length).fill(0))});if(d==='right'||d==='down')g=g.map(r=>r.reverse());if(v)g=g[0].map((_,i)=>g.map(r=>r[i]));if(old!==JSON.stringify(g)){add();if(score>best){best=score;localStorage.quickBest2048=best;document.querySelector('#best').textContent=best}draw()}}function reset(){g=Array.from({length:4},()=>Array(4).fill(0));score=0;add();add();draw()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));document.querySelector('#new').onclick=reset;addEventListener('keydown',e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});reset()</script></body></html>
