<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 // QuickQuest Arcade</title><style>:root{--bg:#15181d;--paper:#f3efe6;--muted:#92989e;--lime:#d8f36a;--coral:#ff6d5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:16px Arial,sans-serif}.bar{height:76px;width:min(900px,calc(100% - 36px));margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #383e45}a{color:var(--paper);text-decoration:none;font-weight:800;letter-spacing:.08em}.back{font-size:.7rem;color:var(--muted)}.wrap{width:min(900px,calc(100% - 36px));margin:auto;padding:30px 0;text-align:center}h1{font-size:clamp(3rem,9vw,6rem);line-height:.8;letter-spacing:-.1em;margin:0 0 22px}h1 span{color:var(--coral)}.stats{display:flex;justify-content:center;gap:10px;margin:15px auto}.stats span{background:#20252c;padding:10px 14px;color:var(--lime);font-size:.7rem;font-weight:800}.board{width:min(460px,calc(100vw - 48px));aspect-ratio:1;margin:22px auto;background:#8b9a75;border:10px solid #8b9a75;border-radius:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cell{display:grid;place-items:center;border-radius:6px;background:#b9c39e;color:#384331;font-size:clamp(1.1rem,6vw,2.1rem);font-weight:900}.cell[data-v="2"]{background:#eee9d8}.cell[data-v="4"]{background:var(--lime)}.cell[data-v="8"]{background:#ff9b73;color:#fff}.cell[data-v="16"],.cell[data-v="32"]{background:var(--coral);color:#fff}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.buttons button{border:0;background:var(--lime);padding:12px 18px;font-weight:900;cursor:pointer}.hint{color:var(--muted);font-size:.75rem;margin-top:18px}</style></head><body><header class="bar"><a href="index.html">✦ QUICKQUEST <span style="color:#ff6d5b">ARCADE</span></a><a class="back" href="index.html">← ALL GAMES</a></header><main class="wrap"><h1>20<span>48</span></h1><div class="stats"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div><div id="board" class="board" hidden></div><div class="buttons"><button id="start">START GAME</button><button data-d="left" hidden>←</button><button data-d="up" hidden>↑</button><button data-d="down" hidden>↓</button><button data-d="right" hidden>→</button><button id="new" hidden>NEW GAME</button></div><p class="hint">Start the game, then use arrow keys or the buttons to slide matching tiles.</p></main><script>let g,score=0,best=+localStorage.quickBest2048||0,playing=false;const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');bestEl.textContent=best;function add(){let e=[];g.forEach((r,y)=>r.forEach((v,x)=>!v&&e.push([x,y])));if(e.length){let[x,y]=e[Math.random()*e.length|0];g[y][x]=Math.random()<.9?2:4}}function draw(){board.innerHTML=g.flat().map(v=>`<div class="cell" data-v="${v}">${v||''}</div>`).join('');scoreEl.textContent=score}function reset(){g=Array.from({length:4},()=>Array(4).fill(0));score=0;add();add();playing=true;board.hidden=false;document.querySelectorAll('[data-d],#new').forEach(b=>b.hidden=false);document.querySelector('#start').hidden=true;draw()}function move(d){if(!playing)return;let old=JSON.stringify(g),v=d==='up'||d==='down';if(v)g=g[0].map((_,i)=>g.map(r=>r[i]));if(d==='right'||d==='down')g=g.map(r=>r.reverse());g=g.map(r=>{let a=r.filter(Boolean);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}return a.concat(Array(4-a.length).fill(0))});if(d==='right'||d==='down')g=g.map(r=>r.reverse());if(v)g=g[0].map((_,i)=>g.map(r=>r[i]));if(old!==JSON.stringify(g)){add();if(score>best){best=score;localStorage.quickBest2048=best;bestEl.textContent=best}draw()}}document.querySelector('#start').onclick=reset;document.querySelector('#new').onclick=reset;let sx=0,sy=0;board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));addEventListener('keydown',e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}})</script></body></html>
