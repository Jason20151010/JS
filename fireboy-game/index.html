<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fireboy &amp; Watergirl // QuickQuest</title><style>:root{--bg:#15181d;--paper:#f3efe6;--lime:#d8f36a;--coral:#ff6d5b;--line:#383e45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:16px Arial,sans-serif}.bar{height:76px;width:min(1050px,calc(100% - 36px));margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:var(--paper);text-decoration:none;font-weight:800;letter-spacing:.08em}.back{font-size:.7rem;color:#92989e}.wrap{width:min(1050px,calc(100% - 36px));margin:0 auto;padding:38px 0}h1{font-size:clamp(2.7rem,8vw,6rem);letter-spacing:-.1em;line-height:.85;margin:0 0 18px}h1 span{color:var(--coral)}.intro{color:#92989e;line-height:1.5}.game{position:relative;background:#87bcc0;border:1px solid var(--line);height:min(68vh,580px);min-height:430px;overflow:hidden;margin-top:25px}.game canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:18px;left:18px;padding:11px 14px;background:#101317d9;border-left:3px solid var(--lime);font-size:.7rem;font-weight:800;letter-spacing:.08em}.controls{margin-top:15px;color:#92989e;font-size:.75rem;font-weight:700;letter-spacing:.06em}.mobile{display:none}@media(max-width:650px){.mobile{display:block}.game{min-height:500px}}</style></head><body><header class="bar"><a href="../index.html">✦ QUICKQUEST <span style="color:#ff6d5b">ARCADE</span></a><a class="back" href="../index.html">← ALL GAMES</a></header><main class="wrap"><h1>FIREBOY <span>&amp;</span><br>WATERGIRL</h1><p class="intro">Move with A / D, jump with W, and reach the green exit.</p><section class="game"><canvas id="scene"></canvas><div class="hud" id="status">🔥 A / D MOVE · W JUMP</div></section><p class="controls">Collect the gems, avoid the lava, and reach the exit.</p></main><script>const c=document.querySelector('#scene'),x=c.getContext('2d'),s=document.querySelector('#status');let W,H,keys={},p={x:50,y:0,vy:0,on:false};const ledges=[{x:.08,y:.78,w:.25},{x:.42,y:.63,w:.22},{x:.72,y:.78,w:.25},{x:.8,y:.4,w:.13}];function size(){const r=c.getBoundingClientRect();W=c.width=r.width*devicePixelRatio;H=c.height=r.height*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=r.width;H=r.height}addEventListener('resize',size);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;e.key===' '&&e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);size();function loop(){p.vx=(keys.a?-3:0)+(keys.d?3:0);if(keys.w&&p.on){p.vy=-10;p.on=false}p.vy+=.45;p.x=Math.max(18,Math.min(W-36,p.x+p.vx));p.y+=p.vy;p.on=false;ledges.forEach(q=>{let y=q.y*H;if(p.x+20>q.x*W&&p.x<q.x*W+q.w*W&&p.y+28>=y&&p.y+28<=y+20&&p.vy>=0){p.y=y-28;p.vy=0;p.on=true}});if(p.y>H+30){p.x=50;p.y=20;p.vy=0}s.textContent=p.x>W-100&&p.y<.5*H?'✦ EXIT FOUND!':'🔥 A / D MOVE · W JUMP';x.clearRect(0,0,W,H);x.fillStyle='#87bcc0';x.fillRect(0,0,W,H);x.fillStyle='#405765';ledges.forEach(q=>x.fillRect(q.x*W,q.y*H,q.w*W,18));x.fillStyle='#ef5b47';x.fillRect(0,H-34,W,34);x.fillStyle='#d8f36a';x.fillRect(W-70,.35*H,38,70);x.font='26px Arial';x.fillText('🔥',p.x,p.y+24);x.fillText('💧',p.x+42,p.y+24);x.fillStyle='#fff';x.font='bold 14px Arial';x.fillText('EXIT',W-67,.35*H-9);requestAnimationFrame(loop)}loop();</script></body></html>
